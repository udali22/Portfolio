services:
  # ========================================================
  # Backend Service: FastAPI (Python 3.12 Slim)
  # Exposed on host port 8000 during local testing.
  # The Azure host Nginx will later proxy /api/* here
  # without requiring a public port.
  # ========================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: portfolio-backend
    restart: unless-stopped
    ports:
      # Exposed on host for direct testing and Swagger UI:
      # http://localhost:8000/docs
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost}
      - APP_NAME=${APP_NAME:-Mohamed Ali Maali | Portfolio API}
    networks:
      - portfolio-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 48M

  # ========================================================
  # Frontend Service: Vite React SPA served by 'serve'
  # No Nginx inside this container.
  # The Azure host Nginx (to be configured separately) will:
  #   /       -> this container on port 3000
  #   /api/*  -> backend container on port 8000
  # During local testing, /api/* calls from the browser will
  # NOT resolve (no host proxy yet) — test the API directly
  # at http://localhost:8000/docs until host Nginx is set up.
  # ========================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: portfolio-frontend
    restart: unless-stopped
    ports:
      # Exposed on host for local testing: http://localhost:3000
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
    networks:
      - portfolio-network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # Verify 'serve' is responding on its port (not nginx)
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 32M

# ========================================================
# Isolated Docker Bridge Network
# Provides internal DNS: services resolve each other by
# name (frontend, backend) without exposing extra ports.
# ========================================================
networks:
  portfolio-network:
    name: portfolio-network
    driver: bridge
